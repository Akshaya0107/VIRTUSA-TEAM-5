# Development-only profile: requires spring-boot.run.useTestClasspath=true.
spring.datasource.url=jdbc:h2:file:./.local-data/demo;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
app.jwt.secret=${JWT_SECRET:${random.uuid}${random.uuid}}
spring.mail.host=127.0.0.1
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
app.mail.from=demo@example.test
app.scheduler.poll-ms=2000
