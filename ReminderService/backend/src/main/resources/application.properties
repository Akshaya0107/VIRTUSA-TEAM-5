spring.application.name=reminder

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/smartreminder?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:reminder_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.sql.init.mode=never

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.database.include=db

app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:900}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.retry.max-retries=${MAX_RETRIES:3}
app.retry.base-seconds=${RETRY_BASE_SECONDS:30}
app.retry.cap-seconds=${RETRY_CAP_SECONDS:3600}
app.scheduler.enabled=${SCHEDULER_ENABLED:true}
app.scheduler.poll-ms=${SCHEDULER_POLL_MS:10000}
app.scheduler.lease-seconds=${SCHEDULER_LEASE_SECONDS:120}
app.mail.from=${MAIL_FROM:noreply@example.test}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
server.error.include-message=never
server.error.include-stacktrace=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=45s
