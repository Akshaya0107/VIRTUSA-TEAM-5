<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><title>Reminder</title></head>
<body style="margin:0;background:#f4f6fb;font-family:Arial,sans-serif;color:#17223b">
<main style="max-width:560px;margin:32px auto;padding:32px;background:white;border-radius:16px">
<p style="color:#5854d6;font-weight:bold;letter-spacing:2px">SMART REMINDER</p>
<h1 th:text="${title}">Your reminder</h1><p>Hello <span th:text="${name}">there</span>,</p>
<p style="white-space:pre-wrap;line-height:1.7" th:text="${message}">Reminder message</p>
<p style="padding:16px;background:#f0efff;border-radius:8px">Scheduled for <strong th:text="${scheduled}"></strong></p>
<p style="font-size:12px;color:#667085">You received this email because a Smart Reminder user scheduled it for this address.</p>
</main></body></html>
