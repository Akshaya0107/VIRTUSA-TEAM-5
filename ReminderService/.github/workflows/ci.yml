name: Verify application
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend tests and package
        working-directory: backend
        run: bash mvnw -B verify
      - name: Frontend install, tests, build, and audit
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          npm audit --audit-level=moderate
      - name: Start isolated integration stack
        run: |
          node tools/init-env.mjs
          docker compose up --build -d --wait --wait-timeout 240
      - name: Live API and scheduler verification
        env:
          BASE_URL: http://127.0.0.1:8088
        run: node tools/verify-live.mjs
      - name: Postman collection
        run: |
          npx --yes newman run documentation/postman/SmartReminder.postman_collection.json --env-var baseUrl=http://127.0.0.1:8088
      - name: Stop test services
        if: always()
        run: docker compose down
